name: notary-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tiny-notary:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/codesign.keychain-db"
          python3 -c 'import base64, os, sys; sys.stdout.buffer.write(base64.b64decode(os.environ["MACOS_CERTIFICATE_P12_BASE64"]))' > "$CERT_PATH"
          security create-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/[ "]//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s \
            -k "$MACOS_CERTIFICATE_PASSWORD" \
            "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build and sign tiny app
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          mkdir -p tiny/TinyNotary.app/Contents/MacOS
          cat > tiny/TinyNotary.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>TinyNotary</string>
            <key>CFBundleIdentifier</key>
            <string>com.catchradar.notarysmoke</string>
            <key>CFBundleName</key>
            <string>TinyNotary</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
          </dict>
          </plist>
          PLIST
          cat > tiny/TinyNotary.app/Contents/MacOS/TinyNotary <<'SH'
          #!/bin/sh
          exit 0
          SH
          chmod +x tiny/TinyNotary.app/Contents/MacOS/TinyNotary
          codesign --force --deep --options runtime --timestamp \
            --sign "$MACOS_CODESIGN_IDENTITY" \
            tiny/TinyNotary.app
          codesign --verify --deep --strict --verbose=2 tiny/TinyNotary.app
          ditto -c -k --keepParent tiny/TinyNotary.app tiny/TinyNotary.zip
          ls -lh tiny/TinyNotary.zip

      - name: Submit tiny app to Apple notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool submit tiny/TinyNotary.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --no-wait \
            --output-format json \
            --no-progress | tee "$RUNNER_TEMP/notary-submit.json"
          submission_id=$(python3 - "$RUNNER_TEMP/notary-submit.json" <<'PY'
          import json
          import sys

          print(json.load(open(sys.argv[1], encoding="utf-8")).get("id", ""))
          PY
          )
          if [ -z "$submission_id" ]; then
            echo "::error::notarytool submit did not return a submission id." >&2
            exit 1
          fi
          echo "Notary submission id: $submission_id"
          echo "SUBMISSION_ID=$submission_id" >> "$GITHUB_ENV"

      - name: Poll tiny notarization for 20 minutes
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            info_json="$RUNNER_TEMP/notary-info.json"
            xcrun notarytool info "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --output-format json \
              --no-progress | tee "$info_json"
            status=$(python3 - "$info_json" <<'PY'
          import json
          import sys

          print(json.load(open(sys.argv[1], encoding="utf-8")).get("status", ""))
          PY
            )
            echo "Tiny notary status: $status"
            case "$status" in
              Accepted)
                exit 0
                ;;
              Invalid|Rejected)
                xcrun notarytool log "$SUBMISSION_ID" - \
                  --apple-id "$APPLE_ID" \
                  --team-id "$APPLE_TEAM_ID" \
                  --password "$APPLE_APP_SPECIFIC_PASSWORD" || true
                echo "::error::Tiny notarization ended with status: $status" >&2
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "::error::Tiny notarization stayed In Progress for 20 minutes. Submission id: $SUBMISSION_ID" >&2
          exit 124
