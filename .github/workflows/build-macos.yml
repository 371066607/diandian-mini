name: build-macos

# Full macOS app bundle (.dmg). Publishes to the `macos` release tag (stable
# download URL) and simultaneously syncs the `code` hot-patch so existing users
# get the update automatically without re-downloading the full package.
# For Python-only changes skip this and use publish-code-patch instead.
on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "更新说明（留空=新版本发布）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp code_version.txt
        run: git show -s --format=%ct HEAD > code_version.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build .app
        run: pyinstaller --noconfirm --clean DiandianMini.spec

      - name: Smoke-test bundled binary
        run: ./dist/DiandianMini.app/Contents/MacOS/DiandianMini --smoke-test

      - name: Create DMG
        run: |
          # `hdiutil: create failed - Resource busy` is a known transient flake on
          # macOS runners (Spotlight/fsevents briefly holding dist/). Let the bundle
          # settle, then retry a few times before giving up.
          sync
          sleep 3
          for attempt in 1 2 3 4 5; do
            if hdiutil create \
                -volname "DiandianMini" \
                -srcfolder dist/DiandianMini.app \
                -ov -format UDZO \
                dist/DiandianMini.dmg; then
              echo "DMG created on attempt $attempt"
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "hdiutil failed after 5 attempts" >&2
              exit 1
            fi
            echo "hdiutil attempt $attempt hit a transient error, retrying in 8s..."
            sleep 8
          done
          echo "DMG size: $(du -sh dist/DiandianMini.dmg | cut -f1)"

      - name: Publish DMG to `macos` release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(cat code_version.txt)
          d=$(git show -s --date=format:'%Y.%m.%d.%H%M' --format=%cd HEAD)
          cl="${{ github.event.inputs.changelog }}"
          [ -z "$cl" ] && cl="新版本发布"
          notes=$(printf 'codever:%s\nchangelog:%s\n\n首次使用请下载 DiandianMini.dmg 安装。\n已安装用户会通过热更新自动升级，无需重新下载。' "$ver" "$cl")
          gh release delete macos --yes 2>/dev/null || true
          gh release create macos \
            --title "macOS 安装包 · v$d" \
            --notes "$notes" \
            dist/DiandianMini.dmg

      - name: Sync code hot-patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(cat code_version.txt)
          d=$(git show -s --date=format:'%Y.%m.%d.%H%M' --format=%cd HEAD)
          cl="${{ github.event.inputs.changelog }}"
          [ -z "$cl" ] && cl="新版本发布"

          stage=app-code-stage
          rm -rf "$stage"; mkdir -p "$stage"
          cp -R app "$stage/app"
          cp main.py bootstrap.py code_version.txt "$stage/"
          find "$stage" -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true
          (cd "$stage" && zip -rq ../app-code.zip .)
          echo "patch size: $(du -sh app-code.zip | cut -f1), codever=$ver"

          notes=$(printf 'codever:%s\nchangelog:%s\n\n（v%s 代码补丁，客户端检查更新会自动热更新）' "$ver" "$cl" "$d")
          gh release delete code --yes 2>/dev/null || true
          gh release create code \
            --title "代码补丁 · v$d" \
            --notes "$notes" \
            --prerelease \
            app-code.zip#app-code.zip
