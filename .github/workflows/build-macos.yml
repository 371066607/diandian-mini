name: build-macos

# Full macOS app bundles (.dmg), built per-architecture and published to the
# `macos` release tag (stable download URL), plus the `code` hot-patch sync so
# existing users auto-update without re-downloading the full package.
# For Python-only changes skip this and use publish-code-patch instead.
#
# 双架构分别打包（互不兼容，用户按自己芯片下载对应的那个）：
#   • DiandianMini-AppleSilicon.dmg  —— arm64，在 macos-14 上原生构建
#   • DiandianMini-Intel.dmg         —— x86_64，在同一台 macos-14(ARM) 上经 Rosetta
#     交叉构建（python.org 的 universal2 Python + `arch -x86_64`）
# 全程只用常驻的 macos-14 运行器，彻底摆脱 Intel 运行器(macos-13)排队枯竭的问题。
# 两个包都要求 macOS 13+（PySide6 6.10 的最低系统要求）。不做 universal2 单包：
# curl_cffi / matplotlib / pydantic-core 等依赖没有 universal2 wheel。客户端
# 「检查更新」只走 code 热补丁(app-code.zip)、不下载 DMG，故拆分 DMG 名不影响自动更新。

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "更新说明（留空=新版本发布）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: AppleSilicon
            asset: DiandianMini-AppleSilicon.dmg
          - arch: x86_64
            label: Intel
            asset: DiandianMini-Intel.dmg
    runs-on: macos-14   # 常驻的 Apple Silicon 运行器；x86_64 经 Rosetta 交叉构建
    steps:
      - uses: actions/checkout@v4

      # --- arm64: 原生 Python（沿用此前已验证可用的路径）---
      - uses: actions/setup-python@v5
        if: matrix.arch == 'arm64'
        with:
          python-version: "3.12"
      - name: Use native python (arm64)
        if: matrix.arch == 'arm64'
        run: echo "PY=python" >> "$GITHUB_ENV"

      # --- x86_64: python.org 的 universal2 Python，配合 `arch -x86_64` 经 Rosetta 出 x86_64 ---
      - name: Set up x86_64 Python via Rosetta
        if: matrix.arch == 'x86_64'
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          PYVER=3.12.8
          curl -fsSL -o /tmp/python.pkg \
            "https://www.python.org/ftp/python/${PYVER}/python-${PYVER}-macos11.pkg"
          sudo installer -pkg /tmp/python.pkg -target /
          PYBIN="/Library/Frameworks/Python.framework/Versions/3.12/bin/python3"
          # Force the universal2 interpreter to run as x86_64 — pip then resolves
          # x86_64 wheels and PyInstaller emits an x86_64 binary.
          echo "PY=arch -x86_64 $PYBIN" >> "$GITHUB_ENV"

      - name: Stamp code_version.txt
        run: git show -s --format=%ct HEAD > code_version.txt

      - name: Install dependencies
        run: |
          $PY -m pip install --upgrade pip
          $PY -m pip install -r requirements.txt pyinstaller

      - name: Build .app
        run: $PY -m PyInstaller --noconfirm --clean DiandianMini.spec

      - name: Verify architecture
        # 防回归：产物必须正好是本 matrix 期望的架构，避免误发架构不符、用户打不开的包。
        run: |
          bin=dist/DiandianMini.app/Contents/MacOS/DiandianMini
          echo "架构:"; file "$bin"; lipo -info "$bin" || true
          if ! lipo -info "$bin" | grep -qw "${{ matrix.arch }}"; then
            echo "::error::打包产物架构不是 ${{ matrix.arch }}（label=${{ matrix.label }}）" >&2
            exit 1
          fi

      - name: Smoke-test bundled binary
        # x86_64 二进制在 ARM 上由 Rosetta 自动执行，无需 arch 前缀。
        run: ./dist/DiandianMini.app/Contents/MacOS/DiandianMini --smoke-test

      - name: Create DMG
        run: |
          # `hdiutil: create failed - Resource busy` is a known transient flake on
          # macOS runners (Spotlight/fsevents briefly holding dist/). Let the bundle
          # settle, then retry a few times before giving up.
          sync
          sleep 3
          for attempt in 1 2 3 4 5; do
            if hdiutil create \
                -volname "DiandianMini" \
                -srcfolder dist/DiandianMini.app \
                -ov -format UDZO \
                "dist/${{ matrix.asset }}"; then
              echo "DMG created on attempt $attempt"
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "hdiutil failed after 5 attempts" >&2
              exit 1
            fi
            echo "hdiutil attempt $attempt hit a transient error, retrying in 8s..."
            sleep 8
          done
          echo "DMG size: $(du -sh dist/${{ matrix.asset }} | cut -f1)"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.label }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build              # 等两个架构都构建成功才发布，避免发出半套包
    runs-on: ubuntu-latest    # gh / zip 跨平台可用，发布步骤与架构无关
    steps:
      - uses: actions/checkout@v4

      - name: Stamp code_version.txt
        # 与 build 阶段同一 HEAD，stamp 出的版本号一致
        run: git show -s --format=%ct HEAD > code_version.txt

      - name: Download DMG artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish DMGs to `macos` release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(cat code_version.txt)
          d=$(git show -s --date=format:'%Y.%m.%d.%H%M' --format=%cd HEAD)
          cl="${{ github.event.inputs.changelog }}"
          [ -z "$cl" ] && cl="新版本发布"
          notes=$(printf 'codever:%s\nchangelog:%s\n\n首次使用请按你的 Mac 芯片下载对应安装包：\n• Apple 芯片(M1/M2/M3…) → DiandianMini-AppleSilicon.dmg\n• Intel 芯片 → DiandianMini-Intel.dmg\n不确定芯片？点左上角  →「关于本机」，看「芯片/处理器」一栏。\n已安装用户会通过热更新自动升级，无需重新下载。' "$ver" "$cl")
          gh release delete macos --yes 2>/dev/null || true
          gh release create macos \
            --title "macOS 安装包 · v$d" \
            --notes "$notes" \
            artifacts/DiandianMini-Intel.dmg \
            artifacts/DiandianMini-AppleSilicon.dmg

      - name: Sync code hot-patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(cat code_version.txt)
          d=$(git show -s --date=format:'%Y.%m.%d.%H%M' --format=%cd HEAD)
          cl="${{ github.event.inputs.changelog }}"
          [ -z "$cl" ] && cl="新版本发布"

          stage=app-code-stage
          rm -rf "$stage"; mkdir -p "$stage"
          cp -R app "$stage/app"
          cp main.py bootstrap.py code_version.txt "$stage/"
          find "$stage" -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true
          (cd "$stage" && zip -rq ../app-code.zip .)
          echo "patch size: $(du -sh app-code.zip | cut -f1), codever=$ver"

          notes=$(printf 'codever:%s\nchangelog:%s\n\n（v%s 代码补丁，客户端检查更新会自动热更新）' "$ver" "$cl" "$d")
          gh release delete code --yes 2>/dev/null || true
          gh release create code \
            --title "代码补丁 · v$d" \
            --notes "$notes" \
            --prerelease \
            app-code.zip#app-code.zip
