name: Release

# Push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`) to build the
# desktop packages and publish them to a GitHub Release. The in-app update checker
# reads that release's tag to detect new versions.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build .app
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name DiandianMini \
            --osx-bundle-identifier com.diandian.mini \
            main.py
      - name: Zip bundle
        run: cd dist && zip -ry DiandianMini-macos.zip DiandianMini.app
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DiandianMini-macos.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build .exe
        run: pyinstaller --noconfirm --clean --windowed --name DiandianMini main.py
      - name: Zip bundle
        run: Compress-Archive -Path dist/DiandianMini -DestinationPath dist/DiandianMini-windows.zip
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DiandianMini-windows.zip
