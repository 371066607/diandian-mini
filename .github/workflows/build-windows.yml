name: build-windows

# Full Windows integrated package (double-click to run). Publishes to the `windows`
# release tag. Triggered manually or by a version tag.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp code_version.txt (commit timestamp)
        shell: bash
        run: git show -s --format=%ct HEAD > code_version.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build .exe
        run: pyinstaller --noconfirm --clean DiandianMini.spec
      - name: Smoke self-check (bundled binary boots)
        run: dist/DiandianMini/DiandianMini.exe --smoke-test
      - name: Zip bundle
        run: Compress-Archive -Path dist/DiandianMini -DestinationPath dist/DiandianMini-windows.zip
      - name: Publish to `windows` release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create windows --title "Windows 整合包" --notes "最新 Windows 整合包（解压双击即用）" 2>/dev/null || true
          gh release upload windows dist/DiandianMini-windows.zip --clobber
