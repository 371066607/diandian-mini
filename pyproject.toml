[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catch-radar-desktop"
version = "0.1.0"
description = "catch-radar Google Play 情报桌面客户端"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "legacy: exercises the frozen local-only offline diagnostic path (google_play_service.py scraping, full app/db migrations) — not the default API-mode product path",
]
